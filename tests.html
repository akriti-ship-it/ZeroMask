<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZeroMask — Unit Test Suite</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #090e17;
      --surface: #111827;
      --border: rgba(148, 163, 184, 0.16);
      --text: #f1f5f9;
      --muted: #94a3b8;
      --pass: #34d399;
      --fail: #f87171;
      --accent: #2dd4bf;
    }
    body {
      margin: 0;
      padding: 28px 20px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    }
    .container {
      max-width: 880px;
      margin: 0 auto;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }
    h1 {
      margin: 0;
      font-size: 20px;
    }
    .summary {
      font-size: 14px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
    }
    .list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .item {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      font-size: 13.5px;
    }
    .badge {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      flex-shrink: 0;
    }
    .badge.pass { background: rgba(52, 211, 153, 0.14); color: var(--pass); }
    .badge.fail { background: rgba(248, 113, 113, 0.14); color: var(--fail); }
    .err {
      margin-top: 4px;
      color: var(--fail);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
    }
    a {
      color: var(--accent);
      text-decoration: none;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>ZeroMask Unit Tests</h1>
        <a href="index.html">&larr; Back to Workspace</a>
      </div>
      <div class="summary" id="summary">Running…</div>
    </header>
    <div class="list" id="resultsList"></div>
  </div>

  <script src="detectors.js"></script>
  <script src="redactor.js"></script>
  <script src="samples.js"></script>
  <script src="tests.js"></script>
  <script>
    (function () {
      const results = (window.ZeroMask && window.ZeroMask.testResults) || [];
      const list = document.getElementById('resultsList');
      const summary = document.getElementById('summary');
      let passed = 0;
      let failed = 0;

      results.forEach((r) => {
        if (r.passed) passed++;
        else failed++;

        const row = document.createElement('div');
        row.className = 'item';

        const left = document.createElement('div');
        const title = document.createElement('div');
        title.textContent = r.name;
        left.appendChild(title);

        if (!r.passed && r.error) {
          const err = document.createElement('div');
          err.className = 'err';
          err.textContent = r.error;
          left.appendChild(err);
        }

        const badge = document.createElement('span');
        badge.className = 'badge ' + (r.passed ? 'pass' : 'fail');
        badge.textContent = r.passed ? 'PASS' : 'FAIL';

        row.appendChild(left);
        row.appendChild(badge);
        list.appendChild(row);
      });

      summary.textContent = passed + ' / ' + results.length + ' passed' + (failed ? ' (' + failed + ' failed)' : '');
      summary.style.color = failed ? 'var(--fail)' : 'var(--pass)';
    })();
  </script>
</body>
</html>
